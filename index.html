<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Move-Master.OS</title>

  <!-- CSS -->
  <link rel="stylesheet" href="./styles.css?v=20251230_7">
</head>

<body>
  <div class="app-shell">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-title">Move-Master.OS</div>
        <div class="brand-sub">Fleet + Moving CRM</div>
      </div>

      <nav class="side-nav">
        <button class="nav-item active" data-view="dashboard" type="button">Dashboard</button>
        <button class="nav-item" data-view="calendar" type="button">Calendar</button>
        <button class="nav-item" data-view="day" type="button">Day Workspace</button>

        <div class="nav-sep"></div>

        <button class="nav-item" data-view="drivers" type="button">Drivers</button>
        <button class="nav-item" data-view="trucks" type="button">Trucks</button>
        <button class="nav-item" data-view="dispatch" type="button">Dispatch</button>
        <button class="nav-item" data-view="finance" type="button">Finance</button>
        <button class="nav-item" data-view="inventory" type="button">Inventory</button>
        <button class="nav-item" data-view="scanner" type="button">AI Scanner</button>
        <button class="nav-item" data-view="sheets" type="button">Sheets</button>
      </nav>

      <div class="sidebar-footer">
        <span id="jsPill" class="pill-status bad">JS: loading…</span>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <!-- Top Toolbar -->
      <header class="topbar">
        <div class="top-left">
          <button id="btnPrev" class="btn" type="button">◀</button>
          <button id="btnToday" class="btn" type="button">Today</button>
          <button id="btnNext" class="btn" type="button">▶</button>
          <div id="contextLine" class="context-line">Foundation mode (Smart)</div>
        </div>

        <div class="top-right">
          <button id="btnAddJob" class="btn primary" type="button">Add Job</button>
          <button id="btnAddReceipt" class="btn" type="button">Add Receipt</button>
        </div>
      </header>

      <!-- Content -->
      <section class="content">

        <!-- DASHBOARD -->
        <div id="view-dashboard" class="view active"></div>

        <!-- CALENDAR -->
        <div id="view-calendar" class="view"></div>

        <!-- DAY WORKSPACE -->
        <div id="view-day" class="view"></div>

        <!-- OTHER VIEWS -->
        <div id="view-drivers" class="view"></div>
        <div id="view-trucks" class="view"></div>
        <div id="view-dispatch" class="view"></div>
        <div id="view-finance" class="view"></div>
        <div id="view-inventory" class="view"></div>
        <div id="view-scanner" class="view"></div>
        <div id="view-sheets" class="view"></div>

      </section>
    </main>
  </div>

  <!-- Shared overlay for modals -->
  <div id="modalOverlay" class="modal-overlay" hidden></div>

  <!-- OCR ENGINE (MUST LOAD FIRST) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <!-- CORE APP -->
  <script src="./app_v5_3.js?v=20251230_9" defer></script>

</body>
</html>
